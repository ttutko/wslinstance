---
# Base system: locale, timezone, WSL config, common directories.

- name: Install locale + core base packages
  ansible.builtin.apt:
    name:
      - locales
      - tzdata
      - ca-certificates
      - man-db
      - less
      - procps
      - sudo
    state: present
    update_cache: true

- name: Enable en_US.UTF-8 locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*en_US\.UTF-8 UTF-8'
    line: 'en_US.UTF-8 UTF-8'
    state: present

- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Set system default locale
  ansible.builtin.copy:
    dest: /etc/default/locale
    mode: "0644"
    content: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8

- name: Set timezone to UTC (user can change via first-run/tzdata)
  ansible.builtin.file:
    src: /usr/share/zoneinfo/UTC
    dest: /etc/localtime
    state: link
    force: true

- name: Write /etc/wsl.conf
  ansible.builtin.copy:
    dest: /etc/wsl.conf
    mode: "0644"
    content: |
      # WSL configuration baked into the image.
      [boot]
      systemd=true

      [automount]
      enabled=true
      options="metadata,umask=22,fmask=11"

      [interop]
      enabled=true
      appendWindowsPath=true

      [user]
      default=root

- name: Ensure /usr/local/bin exists and is on PATH
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Create shared location for offline tool data
  ansible.builtin.file:
    path: /opt/wsl
    state: directory
    mode: "0755"
