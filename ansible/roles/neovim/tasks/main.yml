---
# neovim (from the official tarball — apt's is too old for LazyVim) plus a
# LazyVim config exposed on `vim`/`lvim`, primed so all downloads happen now.

# --- 1. neovim binary -------------------------------------------------------
- name: neovim work dir
  ansible.builtin.tempfile:
    state: directory
    suffix: -nvim
  register: nvim_work

- name: Download neovim {{ neovim_version }}
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "{{ nvim_work.path }}/nvim.tar.gz"
    mode: "0644"

- name: Extract neovim into /opt
  ansible.builtin.unarchive:
    src: "{{ nvim_work.path }}/nvim.tar.gz"
    dest: /opt
    remote_src: true

- name: Symlink nvim onto PATH
  ansible.builtin.file:
    src: /opt/nvim-linux-x86_64/bin/nvim
    dest: /usr/local/bin/nvim
    state: link
    force: true

# --- 2. vim / lvim wrappers (LazyVim via NVIM_APPNAME) ----------------------
- name: Install vim/lvim wrappers that launch the LazyVim config
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    content: |
      #!/bin/sh
      # Launch neovim with the LazyVim configuration (NVIM_APPNAME=lvim).
      # Plain `nvim` stays vanilla; `vim`/`lvim` get the full IDE setup.
      exec env NVIM_APPNAME=lvim /usr/local/bin/nvim "$@"
  loop:
    - vim
    - lvim

# --- 3. LazyVim config (editable sample) ------------------------------------
- name: Install LazyVim config for root and future users
  ansible.builtin.copy:
    src: "{{ src_root }}/config/nvim/"
    dest: "{{ item }}/.config/lvim/"
    mode: "0644"
    directory_mode: "0755"
  loop:
    - /root
    - /etc/skel

# --- 4. Offline priming (needs network + gcc for parser compilation) --------
# gcc/g++/make/libc6-dev come from apt_tools (build-essential) and STAY in the
# image; prime-ts.lua compiles the treesitter parsers with them. On Debian 13 no
# other build-time toolchain is needed.

# nvim-treesitter (main branch) compiles parsers with the tree-sitter CLI. On
# Debian 13 (glibc 2.41) the prebuilt release binary works directly (it needs
# glibc 2.39), so just download it — no source build. Mason is set to
# PATH="append" (config/nvim/lua/plugins/mason.lua) so this /usr/local one wins.
- name: Download tree-sitter CLI {{ treesitter_cli_version }} (prebuilt)
  ansible.builtin.get_url:
    url: "https://github.com/tree-sitter/tree-sitter/releases/download/v{{ treesitter_cli_version }}/tree-sitter-linux-x64.gz"
    dest: /tmp/tree-sitter.gz
    mode: "0644"

- name: Install tree-sitter CLI
  ansible.builtin.shell: |
    set -e
    gunzip -f /tmp/tree-sitter.gz
    install -m 0755 /tmp/tree-sitter /usr/local/bin/tree-sitter
    rm -f /tmp/tree-sitter
  args:
    creates: /usr/local/bin/tree-sitter

# npm-based LSP servers are installed via plain `npm install -g`, NOT Mason:
# current mason.nvim's npm installer HANGS on a random server each headless build
# (bash-language-server, dockerfile, docker-compose… rotate), while a single
# `npm install -g` of all of them is reliable (~8s). node comes from the nodejs
# role (runs before this one). langs.lua/csharp.lua register each of these with
# `mason = false` so LazyVim starts them from these PATH binaries. Mason keeps
# only the reliable prebuilt-binary / pip tools (see prime.lua). See CLAUDE.md.
- name: Install npm-based LSP servers via npm (Mason's npm installer hangs)
  ansible.builtin.shell: |
    set -euo pipefail
    npm install -g \
      pyright typescript-language-server typescript vscode-langservers-extracted \
      yaml-language-server prettier dockerfile-language-server-nodejs \
      @microsoft/compose-language-service bash-language-server
    pfx="$(npm prefix -g)/bin"
    for b in pyright pyright-langserver typescript-language-server \
             vscode-html-language-server vscode-css-language-server vscode-json-language-server \
             yaml-language-server prettier docker-langserver docker-compose-langserver \
             bash-language-server; do
      ln -sf "$pfx/$b" "/usr/local/bin/$b"
    done
  args:
    creates: /usr/local/bin/bash-language-server
    executable: /bin/bash

# debugpy (Python DAP) — installed into a dedicated venv rather than via Mason:
# Mason's pip installer fails for it on trixie/py3.13. langs.lua's nvim-dap-python
# points at this venv's python. (python3-venv comes from apt_tools.)
- name: Install debugpy into a venv (Mason's pip installer fails for it on trixie)
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -m venv /opt/debugpy-venv
    /opt/debugpy-venv/bin/python -m pip install --quiet --upgrade pip
    /opt/debugpy-venv/bin/python -m pip install --quiet debugpy
  args:
    creates: /opt/debugpy-venv/bin/debugpy
    executable: /bin/bash

- name: Copy priming scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nvim_work.path }}/{{ item }}"
    mode: "0644"
  loop:
    - prime.lua
    - prime-ts.lua

# Two priming passes, each its own headless nvim (treesitter must NOT share a
# session with the Mason pass). Wrapped in `timeout` so a headless deadlock
# fails the build (rc 124) instead of hanging forever; GIT_TERMINAL_PROMPT=0
# stops git blocking on a prompt with no tty.
# Mason's installers are occasionally flaky under load — a random tool's download
# stalls and never completes within one headless session (a different straggler
# each run; not a mason-version issue — 2.3.1 is unchanged since build4). So run
# prime.lua in a RETRY loop: prime.lua is idempotent (skips already-installed
# tools), and each attempt is a FRESH nvim session, so a straggler re-downloads
# cleanly instead of staying stuck. Fail the build only if tools are still
# missing after the retries.
- name: "Prime LazyVim pass 1 (plugins + Mason tools), retrying stragglers"
  ansible.builtin.shell: |
    set -uo pipefail
    tools="lua-language-server stylua shfmt shellcheck taplo marksman omnisharp netcoredbg"
    for attempt in 1 2 3 4; do
      echo "=== prime.lua attempt $attempt ==="
      timeout 2400 /usr/local/bin/nvim --headless -c "luafile {{ nvim_work.path }}/prime.lua" || true
      missing=""
      for t in $tools; do
        [ -d "/root/.local/share/lvim/mason/packages/$t" ] || missing="$missing $t"
      done
      if [ -z "$missing" ]; then echo "all mason tools present after attempt $attempt"; exit 0; fi
      echo "attempt $attempt still missing:$missing — retrying"
    done
    echo "FATAL: mason tools still missing after retries:$missing" >&2
    exit 1
  environment: &prime_env
    NVIM_APPNAME: lvim
    HOME: /root
    GIT_TERMINAL_PROMPT: "0"
    GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  args:
    executable: /bin/bash
  changed_when: true

- name: "Prime LazyVim pass 2 (treesitter parsers)"
  ansible.builtin.command: >
    timeout 1800 /usr/local/bin/nvim --headless
    -c "luafile {{ nvim_work.path }}/prime-ts.lua"
  environment: *prime_env
  changed_when: true

- name: Verify treesitter parsers were compiled (offline requirement)
  ansible.builtin.find:
    paths: /root/.local/share/lvim/site/parser
    patterns: "*.so"
  register: ts_parsers

- name: Assert parsers present
  ansible.builtin.assert:
    that: ts_parsers.matched | int > 0
    fail_msg: "No treesitter parsers were compiled — offline highlighting would fail."
    success_msg: "{{ ts_parsers.matched }} treesitter parsers compiled."

- name: Verify LazyVim plugin dir was populated (fail build early if not)
  ansible.builtin.stat:
    path: /root/.local/share/lvim/lazy/lazy.nvim
  register: lazy_dir

- name: Assert LazyVim primed
  ansible.builtin.assert:
    that: lazy_dir.stat.exists
    fail_msg: "LazyVim priming failed — lazy.nvim not present. Check build network access."

- name: Clean neovim work dir
  ansible.builtin.file:
    path: "{{ nvim_work.path }}"
    state: absent
